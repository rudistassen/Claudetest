<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment received</title>
  <style>
    :root { --bg: #eceef2; --card: #fff; --text: #0c1014; --muted: #737373; --good: #1e7a4c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #121212; --text: #f5f5f5; --muted: #a8a8a8; --good: #4ade80; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    main { background: var(--card); border-radius: 14px; padding: 2rem 1.6rem; max-width: 380px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .tick { font-size: 2.6rem; color: var(--good); }
    h1 { font-size: 1.4rem; margin: .4rem 0; }
    p { color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Thank you – payment received</h1>
    <p>Your payment has gone through. A receipt is on its way from Square. You can close this page.</p>
  </main>
</body>
</html>
